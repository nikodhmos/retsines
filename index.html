<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ρετσίνες; 🍷</title>
<meta name="description" content="Θέλετε να πάμε για ρετσίνες;">
<meta property="og:title" content="Θέλετε να πάμε για ρετσίνες; 🍷">
<meta property="og:description" content="Έχεις μια πρόσκληση! Πάτα να την ανοίξεις.">
<meta name="theme-color" content="#0d0d26">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a2e; --paper:#fff4d6; --paper2:#ecd7a4;
  --gold:#f2c14e; --gold2:#d99a2b;
  --green:#3fa34d; --red:#d9573b; --blue:#2f6fd6;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%; overscroll-behavior:none}
body{
  font-family:'Tiny5',monospace; color:var(--ink);
  background:linear-gradient(#0d0d26 0 22%, #141438 22% 44%, #1b1c4a 44% 64%, #24275a 64% 82%, #312f6a 82%);
  background-attachment:fixed; background-color:#0d0d26;
  min-height:100vh; min-height:100dvh; overflow-x:hidden; overscroll-behavior:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:calc(var(--top) + 66px) 14px calc(var(--bot) + 86px);
  -webkit-font-smoothing:none;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
canvas{image-rendering:pixelated; image-rendering:crisp-edges; display:block}
button,a,input,textarea{touch-action:manipulation}

/* ---------- ουρανός / φεγγάρι / θάλασσα ---------- */
.sky{position:fixed; inset:0; z-index:-1; pointer-events:none}
.star{position:absolute; background:#fff; animation:twinkle 2s steps(2) infinite}
.star.g{background:var(--gold)}
@keyframes twinkle{50%{opacity:.15}}
#moon{position:fixed; top:calc(var(--top) + 16px); right:5%; z-index:-1; width:48px; height:48px;
  filter:drop-shadow(0 0 16px rgba(253,243,196,.35))}
.sea{position:fixed; left:0; right:0; bottom:0; height:calc(var(--bot) + 52px); z-index:-1;
  background:linear-gradient(#2a5bb8 0 10px, #1f4a9c 10px 26px, #183c80 26px)}
.sea::before,.sea::after{content:""; position:absolute; left:-64px; right:-64px; height:8px;
  background:repeating-linear-gradient(90deg, #7fb2ff 0 24px, transparent 24px 64px);
  animation:waves 2.4s steps(4) infinite}
.sea::before{top:-8px}
.sea::after{top:18px; opacity:.45; animation-direction:reverse; animation-duration:3.2s}
@keyframes waves{to{transform:translateX(64px)}}

/* ---------- κάρτα ---------- */
.box{
  position:relative; width:100%; max-width:520px; text-align:center;
  background:var(--paper); padding:26px 18px 22px; margin:6px;
  box-shadow:
    0 -6px 0 var(--ink), 0 6px 0 var(--ink), -6px 0 0 var(--ink), 6px 0 0 var(--ink),
    inset -6px -6px 0 var(--paper2), inset 6px 6px 0 #fffbea;
}
.screen{display:none}
.screen.active{display:block; animation:pop .32s steps(4)}
@keyframes pop{from{transform:scale(.88); opacity:0}to{transform:none; opacity:1}}

h1,h2{font-family:'Press Start 2P',monospace; font-weight:400; line-height:1.7}
h1{font-size:clamp(16px,5.2vw,25px); margin:16px 0 8px}
h2{font-size:clamp(16px,5vw,22px); margin:6px 0 4px}
.hl{color:var(--gold);
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),4px 4px 0 var(--ink)}
.sub{font-size:23px; line-height:1.25; margin:6px 0 4px; color:#4a4060}
.sub b{color:var(--ink)}
.sub a{color:var(--blue)}
.hint{font-size:20px; min-height:26px; margin-top:20px; color:#8a5a2b}
.bob{margin:0 auto; animation:bob 1.4s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.sprite-xl{height:150px; width:auto}

/* ---------- κουμπιά ---------- */
.btns{display:flex; justify-content:center; align-items:center; gap:30px; flex-wrap:wrap; margin-top:26px; min-height:80px}
.btn{
  --s:1; --c:var(--green);
  font-family:'Press Start 2P',monospace; font-size:16px; line-height:1.4;
  padding:17px 24px; border:none; border-radius:0; cursor:pointer; color:#fff; background:var(--c);
  text-decoration:none; display:inline-block; white-space:nowrap;
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.28),
    0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink),
    0 8px 0 rgba(0,0,0,.35);
  transform:scale(var(--s)); transition:transform .15s steps(3);
  text-shadow:2px 2px 0 rgba(0,0,0,.35);
}
@media (hover:hover){ .btn:hover{filter:brightness(1.12)} }
.btn:active{transform:scale(var(--s)) translateY(3px);
  box-shadow:inset 4px 4px 0 rgba(0,0,0,.28), 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink)}
.btn:disabled{filter:grayscale(.6); cursor:wait}
.btn.no{--c:var(--red)}
.btn.blue{--c:var(--blue)}
.btn.ghost{--c:#8b7fa8}
.btn.gold{--c:var(--gold2)}
.btn.small{font-size:11px; padding:12px 13px}
.btn.wide{width:100%; margin-top:26px; font-size:16px; padding:18px}
#no.flying{position:fixed; z-index:50; margin:0; transition:left .22s cubic-bezier(.2,1.4,.4,1), top .22s cubic-bezier(.2,1.4,.4,1)}

/* ---------- μουσική ---------- */
#music{position:fixed; top:calc(var(--top) + 12px); left:12px; z-index:60;
  display:flex; align-items:center; gap:9px; font-size:10px; padding:10px 12px}
.eq{display:flex; align-items:flex-end; gap:2px; height:14px}
.eq i{width:4px; height:6px; background:#fff; display:block}
.eq i:nth-child(2){height:12px} .eq i:nth-child(3){height:8px}
#music:not(.on) .eq i{opacity:.45}
#music.on .eq i{animation:eq .6s steps(3) infinite}
#music.on .eq i:nth-child(2){animation-delay:-.2s}
#music.on .eq i:nth-child(3){animation-delay:-.4s}
@keyframes eq{0%{height:4px}50%{height:14px}100%{height:8px}}
#ytwrap{position:fixed; left:0; bottom:0; width:200px; height:200px; opacity:.01; pointer-events:none; z-index:-5}
#ytwrap.show{opacity:1; pointer-events:auto; z-index:80; left:50%; bottom:calc(var(--bot) + 70px); transform:translateX(-50%);
  width:240px; height:auto; background:var(--ink); padding:8px 8px 10px; box-shadow:0 0 0 4px var(--gold), 0 10px 0 4px rgba(0,0,0,.4)}
#ytwrap.show iframe{width:224px; height:200px; display:block}
#ytwrap .yt-tip{display:none; font-family:'Press Start 2P',monospace; font-size:9px; line-height:1.6; color:#fff; text-align:center; margin-bottom:8px}
#ytwrap.show .yt-tip{display:block}
#ytwrap .yt-x{display:none; position:absolute; top:-14px; right:-14px; width:30px; height:30px; border:none; background:var(--red); color:#fff;
  font-family:'Press Start 2P',monospace; font-size:12px; box-shadow:0 0 0 3px var(--ink); cursor:pointer}
#ytwrap.show .yt-x{display:block}
#music.nudge{animation:nudge .5s steps(2) infinite; --c:var(--gold2)}
@keyframes nudge{50%{transform:scale(1.15)}}
.filewarn{position:fixed; left:0; right:0; top:0; z-index:90; background:var(--red); color:#fff; text-align:center;
  font-size:18px; padding:calc(var(--top) + 8px) 12px 8px; box-shadow:0 4px 0 var(--ink)}
.note small{display:block; font-size:14px; color:#a08a9a; margin-top:4px; word-break:break-word}

/* ---------- μέρη ---------- */
.places{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin:24px 6px 8px}
.place{
  background:#fff; border:none; border-radius:0; cursor:pointer; padding:18px 6px 14px;
  font-family:'Press Start 2P',monospace; font-size:14px; color:var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:12px;
  box-shadow:0 -5px 0 var(--ink), 0 5px 0 var(--ink), -5px 0 0 var(--ink), 5px 0 0 var(--ink), inset -5px -5px 0 #e4dccb, 0 10px 0 rgba(0,0,0,.25);
  transition:transform .12s steps(2), background .12s steps(2);
}
.place canvas{height:84px; width:auto}
.place:active,.place:focus-visible{transform:translateY(-6px); background:#fff7dc; outline:none}
@media (hover:hover){ .place:hover{transform:translateY(-6px); background:#fff7dc} .place:hover canvas{animation:bob .8s steps(2) infinite} }
.place small{font-family:'Tiny5',monospace; font-size:18px; color:#7a6a8a}

/* ---------- φόρμα ---------- */
form{text-align:left; margin-top:4px}
label{display:block; font-family:'Press Start 2P',monospace; font-size:11px; line-height:1.6; margin:20px 4px 0}
label small{font-family:'Tiny5',monospace; font-size:16px; color:#7a6a8a}
input,textarea{
  display:block; width:100%; margin-top:10px; padding:9px 12px; min-height:50px;
  font-family:'Tiny5',monospace; font-size:24px; color:var(--ink);
  background:#fff; border:none; border-radius:0; outline:none; color-scheme:light;
  -webkit-appearance:none; appearance:none; text-align:left;
  user-select:text; -webkit-user-select:text;
  box-shadow:0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), inset 4px 4px 0 #ebe3cf;
}
input::-webkit-date-and-time-value{text-align:left}
input:focus,textarea:focus{background:#fffbe6;
  box-shadow:0 -4px 0 var(--gold2), 0 4px 0 var(--gold2), -4px 0 0 var(--gold2), 4px 0 0 var(--gold2), inset 4px 4px 0 #f6e8c0}
textarea{resize:none; line-height:1.1; min-height:70px}
.chips{display:flex; flex-wrap:wrap; gap:12px; margin:16px 4px 0}
.chip{
  font-family:'Tiny5',monospace; font-size:20px; padding:7px 11px; cursor:pointer; border:none; border-radius:0;
  background:var(--paper2); color:var(--ink);
  box-shadow:0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink);
}
.chip.on{background:var(--gold); box-shadow:0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), inset -3px -3px 0 var(--gold2)}
.err{color:var(--red); font-size:20px; min-height:24px; margin-top:12px; text-align:center}

/* ---------- τέλος ---------- */
.cheers{display:flex; justify-content:center; gap:4px; margin:8px 0 16px; height:84px; align-items:flex-end}
.gl{height:80px; width:auto}
.gl.l{transform-origin:100% 100%; animation:clinkL 1.1s steps(3) infinite}
.gl.r{transform-origin:0 100%; animation:clinkR 1.1s steps(3) infinite}
@keyframes clinkL{0%,100%{transform:translateX(-18px) rotate(-14deg)}50%{transform:translateX(2px) rotate(8deg)}}
@keyframes clinkR{0%,100%{transform:translateX(18px) rotate(14deg) scaleX(-1)}50%{transform:translateX(-2px) rotate(-8deg) scaleX(-1)}}
h2.big{font-size:clamp(22px,7vw,32px); margin-bottom:12px}
.note{font-size:19px; color:#8a5a2b; margin-top:12px; min-height:20px}
.note a{color:var(--blue)}
#s-done .btns{gap:20px; flex-direction:column}

.confetti{position:fixed; top:-12px; z-index:40; pointer-events:none; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

footer{margin-top:26px; font-size:17px; color:#b9b3d9; text-align:center}

@media (max-height:700px){ footer{display:none} .sprite-xl{height:120px} .bob{height:130px} }
@media (min-width:600px){
  .box{padding:30px 26px 26px}
  #moon{width:60px; height:60px; right:7%}
  .place canvas{height:96px}
  #s-done .btns{flex-direction:row}
}
</style>
</head>
<body>

<div class="sky" id="sky"></div>
<canvas id="moon" data-sprite="moon" data-scale="6"></canvas>
<div class="sea"></div>
<button class="btn ghost small" id="music" type="button" aria-label="Μουσική"><span class="eq"><i></i><i></i><i></i></span><span id="musicLabel">♫</span></button>
<div id="ytwrap"><div class="yt-tip">πάτα ▶ για μουσική</div><button class="yt-x" id="ytx" type="button">×</button><div id="yt"></div></div>

<main class="box">

  <!-- 0. Πρόσκληση (χρειάζεται ένα άγγιγμα για να παίξει η μουσική) -->
  <section class="screen active" id="s-intro">
    <canvas class="bob sprite-xl" data-sprite="envelope" data-scale="8" style="height:110px"></canvas>
    <h1>Έχεις μια<br><span class="hl">πρόσκληση!</span></h1>
    <p class="sub" id="fromLine" style="display:none">από: <b id="fromName"></b></p>
    <p class="sub">🔊 δυνάμωσε τον ήχο</p>
    <div class="btns">
      <button class="btn gold" id="open" type="button">ΑΝΟΙΞΕ ▶</button>
    </div>
  </section>

  <!-- 1. Η ερώτηση -->
  <section class="screen" id="s-ask">
    <canvas class="bob" data-sprite="bottle" data-scale="7" style="height:140px; width:auto"></canvas>
    <h1>Θέλετε να πάμε για <span class="hl">ρετσίνες</span>;</h1>
    <p class="sub">διάλεξε σοφά...</p>
    <div class="btns" id="btns">
      <button class="btn yes" id="yes" type="button">ΝΑΙ!</button>
      <button class="btn no" id="no" type="button">ΟΧΙ</button>
    </div>
    <p class="hint" id="hint">&nbsp;</p>
  </section>

  <!-- 2. Πού -->
  <section class="screen" id="s-place">
    <h2>Τέλεια!!</h2>
    <p class="sub">Πού πάμε;</p>
    <div class="places" id="places"></div>
  </section>

  <!-- 3. Πότε -->
  <section class="screen" id="s-when">
    <h2>Πότε;</h2>
    <p class="sub">📍 <b id="placeLabel"></b> · <a href="#" id="changePlace">αλλαγή</a></p>
    <form id="form" novalidate>
      <label>Όνομα
        <input id="name" maxlength="40" placeholder="πώς σε λένε;" autocomplete="given-name" enterkeyhint="next">
      </label>
      <label>Ημερομηνία
        <input type="date" id="date">
      </label>
      <div class="chips" id="dateChips"></div>
      <label>Ώρα
        <input type="time" id="time" value="21:00">
      </label>
      <div class="chips" id="timeChips"></div>
      <label>Κάτι άλλο; <small>(προαιρετικό)</small>
        <textarea id="msg" rows="2" maxlength="300" placeholder="π.χ. φέρνω και παρέα"></textarea>
      </label>
      <button class="btn wide" type="submit" id="send">ΣΤΕΙΛ' ΤΟ 🍷</button>
      <p class="err" id="err"></p>
    </form>
  </section>

  <!-- 4. Γεια μας -->
  <section class="screen" id="s-done">
    <div class="cheers">
      <canvas class="gl l" data-sprite="glass" data-scale="8"></canvas>
      <canvas class="gl r" data-sprite="glass" data-scale="8"></canvas>
    </div>
    <h2 class="hl big">ΓΕΙΑ ΜΑΣ!</h2>
    <p class="sub" id="doneText"></p>
    <p class="note" id="doneNote"></p>
    <div class="btns">
      <a class="btn blue small" id="cal" target="_blank" rel="noopener">📅 ΣΤΟ ΗΜΕΡΟΛΟΓΙΟ</a>
      <button class="btn ghost small" id="again" type="button">↺ ΑΠΟ ΤΗΝ ΑΡΧΗ</button>
    </div>
  </section>

</main>

<footer>φτιαγμένο με ♥ και ρετσίνα · <a href="link/" style="color:#f2c14e">φτιάξε το δικό σου link</a></footer>

<script>
/* =========================================================
   ΡΥΘΜΙΣΕΙΣ
   ========================================================= */
const CONFIG = {
  email: "thomasgioav@gmail.com",       // εδώ έρχονται οι απαντήσεις
  places: [
    { id: "bit",    name: "Bit",    article: "στο",  sprite: "lantern", sub: "κλασικά" },
    { id: "kamara", name: "Καμάρα", article: "στην", sprite: "arch",    sub: "πάντα καλή" },
  ],
  times: ["20:00", "21:00", "22:00", "23:00"],
  music: {
    // Δημήτρης Μητροπάνος – Τα Λαδάδικα (επίσημο YouTube). Το δεύτερο είναι εφεδρικό.
    youtube: ["8a94DSC10sA", "86jw8pPubVM"],
    volume: 70,
  },
};

/* ---------- σε ποιον πάει η απάντηση (προσωπικά links από το link/) ---------- */
// ?r=... = base64url JSON { f: όνομα αποστολέα, n: ntfy topic | e: email }
const DEST = (() => {
  try {
    const k = new URLSearchParams(location.search).get("r");
    if (!k) return {};
    const b = k.replace(/-/g, "+").replace(/_/g, "/");
    const o = JSON.parse(decodeURIComponent(escape(atob(b + "===".slice((b.length + 3) % 4))))) || {};
    return {
      f: typeof o.f === "string" ? o.f.trim().slice(0, 30) : "",
      n: typeof o.n === "string" && /^[A-Za-z0-9_-]{6,64}$/.test(o.n) ? o.n : "",
      e: typeof o.e === "string" && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.e) ? o.e : "",
    };
  } catch (e) { return {}; }
})();
const MAIL_TO = DEST.e || CONFIG.email;

/* ---------- pixel art ---------- */
const PAL = {
  k:"#1a1a2e", r:"#d9573b", R:"#a63a24", g:"#effff7", c:"#a9d8c4",
  y:"#f2c14e", o:"#d99a2b", w:"#ffffff", b:"#2f6fd6", e:"#f3e6c4",
  s:"#dcc79c", S:"#a88f62", n:"#2a3470", G:"#5a8f3c", m:"#fdf3c4", M:"#e3d29a"
};
const SPRITES = {
  envelope: [
    "kkkkkkkkkkkkkkkk",
    "kkwwwwwwwwwwwwkk",
    "kwkwwwwwwwwwwkwk",
    "kwwkwwwwwwwwkwwk",
    "kwwwkwwwwwwkwwwk",
    "kwwwwkwwwwkwwwwk",
    "kwwwwwkrrkwwwwwk",
    "kwwwwwwkkwwwwwwk",
    "kwwwwwwwwwwwwwwk",
    "kewwwwwwwwwwwwek",
    "keeeeeeeeeeeeeek",
    "kkkkkkkkkkkkkkkk",
  ],
  bottle: [
    "....kkkk....",
    "....krrk....",
    "....kRRk....",
    "....kkkk....",
    "....kgck....",
    "....kgck....",
    "....kgck....",
    "...kkgckk...",
    "..kgccccck..",
    "..kgoooook..",
    "..kgyyyyyk..",
    "..kwwwwwwk..",
    "..kwbbbbwk..",
    "..kwbwwbwk..",
    "..kwbbbbwk..",
    "..kwwwwwwk..",
    "..kgyyyyyk..",
    "..kgyyyyok..",
    "..kgyyyyok..",
    "..kyyyyook..",
    "..kooooook..",
    "...kkkkkk...",
  ],
  glass: [
    "kkkkkkkk",
    "kcccccgk",
    "kooooogk",
    "kyyyyygk",
    "kyyyyygk",
    "kyyyyygk",
    ".kyyyyk.",
    ".kyyyyk.",
    ".kcccck.",
    "..kkkk..",
  ],
  lantern: [
    "....kk....",
    "...k..k...",
    "..kkkkkk..",
    ".kRRRRRRk.",
    ".kyyyyyyk.",
    ".kyywwyyk.",
    ".kyowwoyk.",
    ".kyoooyyk.",
    ".kyyyyyyk.",
    ".kRRRRRRk.",
    "..kkkkkk..",
  ],
  arch: [
    "....ssssss....",
    "..ssSssssSss..",
    ".sSssnnnnssSs.",
    ".ssnnnyynnnss.",
    "sSsnnnyynnnsSs",
    "ssnnnnnnnnnnss",
    "sSnnnnnnnnnnSs",
    "ssnnnnnnnnnnss",
    "sSnnnnnnnnnnSs",
    "ssnnnnnnnnnnss",
    "sSnnnnnnnnnnSs",
    "GGGGGGGGGGGGGG",
  ],
  moon: [
    "...mmmm...",
    ".mmmmmmmm.",
    ".mmMmmmmm.",
    "mmmMMmmmmm",
    "mmmmmmmMmm",
    "mmmmmmmmmm",
    "mmMmmmmmmm",
    ".mmmmmMmm.",
    ".mmmmmmmm.",
    "...mmmm...",
  ],
};
function paint(cv) {
  const sp = SPRITES[cv.dataset.sprite], sc = +cv.dataset.scale || 6;
  const w = Math.max(...sp.map(r => r.length));
  cv.width = w * sc; cv.height = sp.length * sc;
  const ctx = cv.getContext("2d");
  sp.forEach((row, y) => [...row].forEach((ch, x) => {
    if (PAL[ch]) { ctx.fillStyle = PAL[ch]; ctx.fillRect(x * sc, y * sc, sc, sc); }
  }));
}

/* ---------- αστέρια ---------- */
const sky = document.getElementById("sky");
for (let i = 0; i < 60; i++) {
  const s = document.createElement("div");
  const z = Math.random() < .25 ? 4 : 2;
  s.className = "star" + (Math.random() < .2 ? " g" : "");
  Object.assign(s.style, {
    left: Math.random() * 100 + "%", top: Math.random() * 82 + "%",
    width: z + "px", height: z + "px",
    animationDelay: (Math.random() * 3).toFixed(2) + "s",
    animationDuration: (1.5 + Math.random() * 2.5).toFixed(2) + "s",
  });
  sky.appendChild(s);
}

const $ = id => document.getElementById(id);
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- 8-bit εφέ ---------- */
let actx = null, soundOn = true;
function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
addEventListener("pointerdown", unlockAudio, { passive: true });
function beep(f = 660, d = .08, when = 0) {
  if (!soundOn || !actx || actx.state !== "running") return;
  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
  o.type = "square"; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.025, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
}
const jingle = () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, .13, i * .11));

/* ---------- μουσική (YouTube) ---------- */
let yt = null, ytReady = false, ytWant = false, ytIdx = 0, ytFailed = false;
const musicBtn = $("music");
(function loadYT() {
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => { ytFailed = true; markIntroReady(); };
  document.head.appendChild(s);
})();
window.onYouTubeIframeAPIReady = () => {
  const id = CONFIG.music.youtube[0];
  yt = new YT.Player("yt", {
    width: 200, height: 200, videoId: id,
    playerVars: { autoplay: 0, controls: 1, playsinline: 1, loop: 1, playlist: id, rel: 0, origin: location.origin },
    events: {
      onReady: () => { ytReady = true; yt.setVolume(CONFIG.music.volume); markIntroReady(); if (ytWant) playMusic(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) { yt.seekTo(0); yt.playVideo(); }
        if (e.data === YT.PlayerState.PLAYING) { musicBtn.classList.remove("nudge"); setTimeout(() => ytwrap.classList.remove("show"), 600); }
        updateMusicBtn();
      },
      onError: () => {
        ytIdx++;
        const next = CONFIG.music.youtube[ytIdx];
        if (next) { yt.loadVideoById(next); }
        else { ytFailed = true; musicBtn.classList.add("nudge"); updateMusicBtn(); }
      },
    },
  });
};
function isPlaying() { return ytReady && yt.getPlayerState && yt.getPlayerState() === 1; }
let musicCheck = 0;
function playMusic() {
  ytWant = true;
  if (!ytReady || ytFailed) return;
  yt.unMute(); yt.setVolume(CONFIG.music.volume); yt.playVideo();
  // αν σε 2.5" δεν παίζει (π.χ. iPhone), δείξε κουμπί να το ξεκινήσουν με το χέρι
  clearTimeout(musicCheck);
  musicCheck = setTimeout(() => {
    if (soundOn && ytWant && !isPlaying()) musicBtn.classList.add("nudge");
    updateMusicBtn();
  }, 2500);
}
const ytwrap = document.getElementById("ytwrap");
document.getElementById("ytx").onclick = () => ytwrap.classList.remove("show");
function pauseMusic() { ytWant = false; if (ytReady) yt.pauseVideo(); }
function updateMusicBtn() {
  const on = soundOn && (isPlaying() || (ytWant && !ytFailed));
  musicBtn.classList.toggle("on", on);
  $("musicLabel").textContent = soundOn ? "♫" : "OFF";
}
musicBtn.onclick = () => {
  if (musicBtn.classList.contains("nudge") || (soundOn && ytWant && !isPlaying())) {
    // δεν ξεκίνησε μόνη της: ξαναδοκίμασε και δείξε το player για να πατήσουν ▶
    musicBtn.classList.remove("nudge");
    soundOn = true; playMusic();
    if (ytFailed) { window.open("https://www.youtube.com/watch?v=" + CONFIG.music.youtube[0], "_blank"); return; }
    setTimeout(() => { if (!isPlaying()) ytwrap.classList.add("show"); }, 700);
    updateMusicBtn(); return;
  }
  soundOn = !soundOn;
  soundOn ? playMusic() : pauseMusic();
  updateMusicBtn(); buzz(15);
};
// σταματάει όταν κλείνει η οθόνη / αλλάζει app, ξαναπαίζει όταν γυρίσεις
document.addEventListener("visibilitychange", () => {
  if (!ytReady) return;
  if (document.hidden) yt.pauseVideo();
  else if (soundOn && ytWant) yt.playVideo();
});

/* ---------- οθόνες ---------- */
const state = { place: null, noCount: 0 };
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  no.style.visibility = id === "s-ask" ? "" : "hidden";
  scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- πρόσκληση ---------- */
const openBtn = $("open");
let introReady = false;
function markIntroReady() { introReady = true; openBtn.textContent = "ΑΝΟΙΞΕ ▶"; }
openBtn.textContent = "...";
setTimeout(markIntroReady, 3500);            // αν αργεί το YouTube, προχώρα χωρίς να περιμένεις
openBtn.onclick = () => {
  unlockAudio(); playMusic(); updateMusicBtn();
  beep(523, .08); beep(784, .12, .08); buzz(20);
  show("s-ask");
};

/* ---------- το ΟΧΙ που δεν πατιέται ---------- */
const yes = $("yes"), no = $("no"), hint = $("hint");
const NO_TEXTS = ["Σίγουρα;", "Ξανασκέψου το", "Χαχα όχι", "Δεν πιάνεται", "Πιο γρήγορα!", "Ρετσίνα όμως...",
  "Μην επιμένεις", "Είναι παγωμένη!", "Ούτε για πλάκα", "Άσ' το", "Έλα τώρα", "Πάτα το ΝΑΙ"];
const HINTS = { 1: "ε όχι 🙂", 3: "το ΟΧΙ είναι διακοσμητικό", 6: "σε βλέπω που προσπαθείς 👀",
  10: "οκ φτάνει, πάτα το ΝΑΙ", 15: "θα το γράψω στο mail πόσες φορές προσπάθησες..." };
let lastDodge = 0;

function dodge(px, py, force) {
  const now = performance.now();
  if (!force && now - lastDodge < 160) return;
  lastDodge = now;

  if (!no.classList.contains("flying")) {
    const r = no.getBoundingClientRect();
    no.style.left = r.left + "px"; no.style.top = r.top + "px";
    no.classList.add("flying");
    document.body.appendChild(no);
    no.offsetWidth;
  }
  state.noCount++;
  no.textContent = NO_TEXTS[(state.noCount - 1) % NO_TEXTS.length];
  if (HINTS[state.noCount]) hint.textContent = HINTS[state.noCount];
  yes.style.setProperty("--s", Math.min(1 + state.noCount * .07, 1.6).toFixed(2));

  const nr = no.getBoundingClientRect();
  const avoid = [yes, document.querySelector("#s-ask h1"), musicBtn].map(el => el.getBoundingClientRect());
  const hits = (x, y) => avoid.some(a => x < a.right + 14 && x + nr.width > a.left - 14 && y < a.bottom + 14 && y + nr.height > a.top - 14);
  const W = innerWidth, H = innerHeight, pad = 12;
  const far = Math.min(200, Math.min(W, H) / 3);
  let x, y, i = 0;
  do {
    x = pad + Math.random() * Math.max(1, W - nr.width - 2 * pad);
    y = pad + Math.random() * Math.max(1, H - nr.height - 2 * pad);
    i++;
  } while (i < 120 && (Math.hypot(x + nr.width / 2 - px, y + nr.height / 2 - py) < far || hits(x, y)));
  no.style.left = x + "px"; no.style.top = y + "px";
  beep(220 + Math.random() * 200, .07); buzz(25);
}
const askActive = () => $("s-ask").classList.contains("active");

// ποντίκι (υπολογιστής): φεύγει πριν το φτάσεις
document.addEventListener("pointermove", e => {
  if (e.pointerType === "touch" || !askActive()) return;
  const r = no.getBoundingClientRect(), m = 45;
  if (e.clientX > r.left - m && e.clientX < r.right + m && e.clientY > r.top - m && e.clientY < r.bottom + m)
    dodge(e.clientX, e.clientY);
});
// κινητό: αν το δάχτυλο ακουμπήσει κοντά του, φεύγει
document.addEventListener("touchstart", e => {
  if (!askActive() || e.target.closest("#yes, #music")) return;
  const t = e.touches[0], r = no.getBoundingClientRect(), m = 40;
  if (t.clientX > r.left - m && t.clientX < r.right + m && t.clientY > r.top - m && t.clientY < r.bottom + m) {
    if (e.target === no && e.cancelable) e.preventDefault();
    dodge(t.clientX, t.clientY, true);
  }
}, { passive: false });
// σε κάθε περίπτωση, το ΟΧΙ δεν κάνει ποτέ τίποτα
["pointerdown", "click"].forEach(ev => no.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation();
  if (e.pointerType === "touch" || (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents)) return;
  dodge(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, true);
}));
no.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); dodge(innerWidth / 2, innerHeight / 2, true); } });
addEventListener("resize", () => {
  if (!no.classList.contains("flying")) return;
  const r = no.getBoundingClientRect();
  no.style.left = Math.max(8, Math.min(r.left, innerWidth - r.width - 12)) + "px";
  no.style.top = Math.max(8, Math.min(r.top, innerHeight - r.height - 12)) + "px";
});

yes.onclick = () => {
  if (!isPlaying() && soundOn) playMusic();
  beep(660, .1); beep(990, .14, .1); buzz([20, 40, 20]);
  confetti(30);
  show("s-place");
};

/* ---------- μέρη ---------- */
CONFIG.places.forEach(p => {
  const b = document.createElement("button");
  b.className = "place"; b.type = "button";
  b.innerHTML = `<canvas data-sprite="${p.sprite}" data-scale="8"></canvas><span>${p.name}</span><small>${p.sub || ""}</small>`;
  b.onclick = () => {
    state.place = p; beep(784, .08); beep(1047, .1, .08); buzz(20);
    $("placeLabel").textContent = p.name;
    show("s-when");
  };
  $("places").appendChild(b);
});
$("changePlace").onclick = e => { e.preventDefault(); show("s-place"); };

/* ---------- ημερομηνία & ώρα ---------- */
const p2 = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const dateIn = $("date"), timeIn = $("time");
const today = new Date(); today.setHours(0, 0, 0, 0);
dateIn.min = iso(today);

const dateOpts = [["Απόψε", 0], ["Αύριο", 1]];
[[5, "Παρασκευή"], [6, "Σάββατο"]].forEach(([dow, label]) => {
  const off = (dow - today.getDay() + 7) % 7;
  if (off > 1) dateOpts.push([label, off]);
});
function makeChips(el, items, input) {
  items.forEach(([label, value]) => {
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip"; c.textContent = label; c.dataset.v = value;
    c.onclick = () => { input.value = value; syncChips(); beep(1200, .04); buzz(10); };
    el.appendChild(c);
  });
}
makeChips($("dateChips"), dateOpts.map(([l, off]) => { const d = new Date(today); d.setDate(d.getDate() + off); return [l, iso(d)]; }), dateIn);
makeChips($("timeChips"), CONFIG.times.map(t => [t, t]), timeIn);
function syncChips() {
  document.querySelectorAll("#dateChips .chip").forEach(c => c.classList.toggle("on", c.dataset.v === dateIn.value));
  document.querySelectorAll("#timeChips .chip").forEach(c => c.classList.toggle("on", c.dataset.v === timeIn.value));
}
dateIn.addEventListener("input", syncChips); dateIn.addEventListener("change", syncChips);
timeIn.addEventListener("input", syncChips); timeIn.addEventListener("change", syncChips);
syncChips();
$("name").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("name").blur(); } });

function niceDate(v) {
  const [Y, M, D] = v.split("-").map(Number);
  return new Date(Y, M - 1, D).toLocaleDateString("el-GR", { weekday: "long", day: "numeric", month: "long" });
}
function calLink(d) {
  const [Y, M, D] = d.date.split("-").map(Number), [h, mi] = d.time.split(":").map(Number);
  const s = new Date(Y, M - 1, D, h, mi), e = new Date(s.getTime() + 3 * 36e5);
  const f = x => `${x.getFullYear()}${p2(x.getMonth() + 1)}${p2(x.getDate())}T${p2(x.getHours())}${p2(x.getMinutes())}00`;
  const q = new URLSearchParams({
    action: "TEMPLATE", text: `🍷 Ρετσίνες ${d.place.article} ${d.place.name}`,
    dates: `${f(s)}/${f(e)}`, ctz: "Europe/Athens", location: d.place.name,
    details: "Θέλετε να πάμε για ρετσίνες; — ΝΑΙ!",
  });
  return "https://calendar.google.com/calendar/render?" + q;
}

/* ---------- αποστολή στο mail (FormSubmit) ---------- */
async function sendMail(d) {
  const res = await fetch(`https://formsubmit.co/ajax/${MAIL_TO}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      _subject: `🍷 Ρετσίνες: ${d.name} → ${d.place.name}, ${niceDate(d.date)} ${d.time}`,
      _template: "table", _captcha: "false",
      "Όνομα": d.name, "Μέρος": d.place.name, "Ημερομηνία": niceDate(d.date), "Ώρα": d.time,
      "Μήνυμα": d.msg || "-", "Προσπάθειες να πατήσει το ΟΧΙ": String(state.noCount),
    }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || String(j.success) !== "true") throw new Error(j.message || "HTTP " + res.status);
}
/* ---------- αποστολή στο κινητό (ntfy) ---------- */
async function sendNtfy(d) {
  const res = await fetch("https://ntfy.sh/", {
    method: "POST",
    body: JSON.stringify({
      topic: DEST.n,
      title: `🍷 ${d.name} → ${d.place.name}, ${niceDate(d.date)} ${d.time}`,
      message: `Όνομα: ${d.name}\nΜέρος: ${d.place.name}\nΗμερομηνία: ${niceDate(d.date)}\nΏρα: ${d.time}` +
        (d.msg ? `\nΜήνυμα: ${d.msg}` : "") + `\nΠροσπάθειες να πατήσει το ΟΧΙ: ${state.noCount}`,
      tags: ["wine_glass"], priority: 5,
    }),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
}
function mailtoLink(d) {
  const body = `Όνομα: ${d.name}\nΜέρος: ${d.place.name}\nΗμερομηνία: ${niceDate(d.date)}\nΏρα: ${d.time}\nΜήνυμα: ${d.msg || "-"}`;
  return `mailto:${MAIL_TO}?subject=${encodeURIComponent("🍷 Ρετσίνες!")}&body=${encodeURIComponent(body)}`;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  document.activeElement && document.activeElement.blur();   // κλείνει το πληκτρολόγιο
  const err = $("err"), send = $("send");
  const d = { name: $("name").value.trim(), date: dateIn.value, time: timeIn.value, msg: $("msg").value.trim(), place: state.place };
  const fail = m => { err.textContent = m; beep(150, .2); buzz([60, 40, 60]); };
  if (!d.name) { fail("Πες μας ποιος/ποια είσαι!"); return; }
  if (!d.date) { fail("Διάλεξε μέρα!"); return; }
  if (d.date < iso(today)) { fail("Στο παρελθόν δεν πάμε (ακόμα)"); return; }
  if (!d.time) { fail("Διάλεξε ώρα!"); return; }
  err.textContent = "";

  send.disabled = true; send.textContent = "ΣΤΕΛΝΕΤΑΙ...";
  let note = "";
  try {
    if (DEST.n) { await sendNtfy(d); note = "🍷 στάλθηκε!"; }
    else { await sendMail(d); note = "✉ στάλθηκε!"; }
  }
  catch (ex) {
    const why = String(ex.message || ex).replace(/[<>&]/g, "");
    note = DEST.n
      ? `Η ειδοποίηση δεν έφτασε 😬 στείλε ένα μήνυμα${DEST.f ? " στον/στην " + DEST.f.replace(/[<>&"]/g, "") : ""} με τα παραπάνω!`
      : /activ/i.test(why)
      ? `Η φόρμα θέλει ενεργοποίηση: άνοιξε το ${MAIL_TO} (κοίτα και στα spam) και πάτα «Activate Form». <a href="${mailtoLink(d)}">ή στείλ' το με mail</a>`
      : `Το mail δεν έφυγε 😬 <a href="${mailtoLink(d)}">στείλ' το από εδώ</a><small>${why}</small>`;
  }
  send.disabled = false; send.textContent = "ΣΤΕΙΛ' ΤΟ 🍷";

  const t = $("doneText");
  t.textContent = "";
  t.append(`${d.name}, τα λέμε ${d.place.article} `);
  const b = document.createElement("b"); b.textContent = d.place.name; t.append(b);
  t.append(document.createElement("br"), `${niceDate(d.date)} στις ${d.time}!`);
  $("doneNote").innerHTML = note;
  $("cal").href = calLink(d);
  show("s-done");
  jingle(); confetti(90); buzz([30, 50, 30, 50, 80]);
});

$("again").onclick = () => {
  state.noCount = 0; hint.innerHTML = "&nbsp;";
  no.classList.remove("flying"); no.style.left = no.style.top = ""; no.textContent = "ΟΧΙ";
  $("btns").appendChild(no); yes.style.setProperty("--s", 1);
  show("s-ask");
};

/* ---------- κομφετί ---------- */
function confetti(n) {
  const cols = ["#f2c14e", "#d9573b", "#3fa34d", "#2f6fd6", "#ffffff", "#ff7aa8"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div"), z = Math.random() < .5 ? 6 : 10;
    c.className = "confetti";
    Object.assign(c.style, {
      left: Math.random() * 100 + "vw", width: z + "px", height: z + "px",
      background: cols[i % cols.length],
      animationDuration: (1.8 + Math.random() * 2) + "s",
      animationDelay: (Math.random() * .6) + "s",
      animationTimingFunction: `steps(${12 + (Math.random() * 10 | 0)})`,
    });
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

document.querySelectorAll("canvas[data-sprite]").forEach(paint);
if (DEST.f) { $("fromName").textContent = DEST.f; $("fromLine").style.display = ""; }

// Αν ανοίχτηκε σαν αρχείο από τον υπολογιστή, ούτε η μουσική ούτε το mail δουλεύουν
if (location.protocol === "file:") {
  const w = document.createElement("div");
  w.className = "filewarn";
  w.textContent = "⚠ Άνοιξέ το από το link του GitHub Pages, όχι σαν αρχείο — αλλιώς δεν παίζει μουσική και δεν στέλνει mail.";
  document.body.appendChild(w);
}
</script>
